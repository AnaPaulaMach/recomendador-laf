<nav aria-label="Progreso del recomendador" class="flow-navigation">
  <p class="flow-progress">
    <span class="flow-progress-step">Paso {{ step }} de 4</span>
    <span class="flow-progress-name">{% if step == 1 %}Qué te importa{% elif step == 2 %}Productos{% elif step == 3 %}Cómo comprar{% elif step == 4 %}Dónde comprar{% endif %}</span>
    <span class="flow-progress-bar" aria-hidden="true">
      <span class="{% if step >= 1 %}on{% endif %}"></span>
      <span class="{% if step >= 2 %}on{% endif %}"></span>
      <span class="{% if step >= 3 %}on{% endif %}"></span>
      <span class="{% if step >= 4 %}on{% endif %}"></span>
    </span>
  </p>
  <ol>
    <li class="{% if step == 1 %}flow-step-active{% elif step > 1 %}flow-step-done{% endif %}" {% if step == 1 %}aria-current="step"{% endif %}><span class="flow-step-num" aria-hidden="true">1</span>Qué te importa</li>
    <li class="{% if step == 2 %}flow-step-active{% elif step > 2 %}flow-step-done{% endif %}" {% if step == 2 %}aria-current="step"{% endif %}><span class="flow-step-num" aria-hidden="true">2</span>Productos</li>
    <li class="{% if step == 3 %}flow-step-active{% elif step > 3 %}flow-step-done{% endif %}" {% if step == 3 %}aria-current="step"{% endif %}><span class="flow-step-num" aria-hidden="true">3</span>Cómo comprar</li>
    <li class="{% if step == 4 %}flow-step-active{% endif %}" {% if step == 4 %}aria-current="step"{% endif %}><span class="flow-step-num" aria-hidden="true">4</span>Dónde comprar</li>
  </ol>
</nav>
